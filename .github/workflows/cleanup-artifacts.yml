# Frees GitHub Actions artifact storage, so new APKs can be uploaded.
# Release APKs are release assets, not artifacts, and are never touched.
name: Clean up old artifacts

on:
  push:
    paths:
      - .github/workflows/cleanup-artifacts.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // A push or a manual run clears everything older than 30 minutes;
            // the daily run keeps the last 7 days.
            const maxAgeMs = context.eventName === 'schedule' ? 7 * 24 * 3600e3 : 30 * 60e3;
            const cutoff = Date.now() - maxAgeMs;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            let count = 0, bytes = 0;
            for (const a of artifacts) {
              if (a.expired || new Date(a.created_at).getTime() > cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id
              });
              count++; bytes += a.size_in_bytes;
            }
            core.notice(`Deleted ${count} of ${artifacts.length} artifacts (${(bytes / 1048576).toFixed(0)} MB).`);
