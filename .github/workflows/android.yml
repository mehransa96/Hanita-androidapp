name: Android CI

# Actions minutes are limited on a private repository, so CI runs once per change:
#   - pull requests run the build job (a push to a PR branch no longer starts a second, duplicate run);
#   - main runs it once more after a merge;
#   - the slow emulator smoke test and the screenshots run only when started by hand
#     (Actions > Android CI > Run workflow). The release workflow still smoke-tests every release.
# Changes that touch only documentation or release notes do not start CI.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "licenses/**"
      - ".github/release-notes/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "licenses/**"
      - ".github/release-notes/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu-latest runner already ships the Android SDK (ANDROID_HOME);
      # AGP downloads any missing platform/build-tools automatically.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One Gradle invocation: configuration and compilation are shared by all four tasks.
      - name: Build, test and lint (debug + minified release)
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest assembleRelease lintDebug

      - name: Print lint findings
        if: always()
        run: |
          for m in app core partner; do echo "=== $m"; cat "$m/build/reports/lint-results.txt" || true; done

      - name: Print Room schema
        if: always()
        run: find app/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; || true

      - name: Upload lint report and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lint-and-schemas
          path: |
            app/build/reports/lint-results-debug.*
            core/build/reports/lint-results-debug.*
            partner/build/reports/lint-results-debug.*
            app/schemas/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hanita-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # "GentleMan": the companion app for partners.
      - name: Upload partner companion APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hanita-partner-apk
          path: |
            partner/build/outputs/apk/debug/*.apk
            partner/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            partner/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

  # Launches the minified release builds on an emulator so an R8 problem shows up before a
  # release does. Signed here with a throwaway key; real releases use the permanent key.
  release-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: ./gradlew --stacktrace :app:assembleRelease :partner:assembleRelease

      - name: Sign with a throwaway key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 -storepass cismoke -keypass cismoke \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci
          for m in app partner; do
            in="$(ls $m/build/outputs/apk/release/*.apk | head -1)"
            "$apksigner" sign --ks "$RUNNER_TEMP/ci.p12" --ks-pass pass:cismoke --out "$m-smoke.apk" "$in"
          done

      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/CodeQL" && df -h /

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Launch both apps on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ATD = Google's slim "Automated Test Device" image built for CI: boots far faster
          # and needs much less CPU/RAM than a full google_apis image on hosted runners.
          api-level: 30
          arch: x86_64
          target: aosp_atd
          channel: canary
          force-avd-creation: false
          disable-animations: true
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: .github/scripts/smoke-test.sh app-smoke.apk com.aistudio.hanita.zxwpm partner-smoke.apk com.hanita.partner

  # Renders every main screen (light/dark, 411dp and 360dp phones, large font) to PNGs so the
  # mobile UI can be reviewed without a device. Informational: it never blocks a merge.
  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record screenshots
        run: ./gradlew --stacktrace :app:testDebugUnitTest -Pscreenshots -Proborazzi.test.record=true --tests com.example.ScreensScreenshotTest

      - name: Record GentleMan screenshots
        if: always()
        run: ./gradlew --stacktrace :partner:testDebugUnitTest -Pscreenshots -Proborazzi.test.record=true --tests com.hanita.partner.GentlemanScreenshotTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: |
            app/build/outputs/roborazzi/
            partner/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 3
