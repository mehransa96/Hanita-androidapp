name: Release APK

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/debug/app-debug.apk "hanita-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Hanita ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: hanita-${{ github.ref_name }}.apk
